{% load rawnaq %}<div class="empty-state">
  <span class="empty-state__icon">{% icon icon_name|default:"sparkle" %}</span>
  <h2 class="empty-state__title">{{ title }}</h2>
  {% if text %}<p class="empty-state__text">{{ text }}</p>{% endif %}
  {% if action_url %}<a class="button" href="{{ action_url }}">{{ action_label }}</a>{% endif %}
</div>
