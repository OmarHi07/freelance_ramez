# Local development with PostgreSQL:
#   cp .env.example .env
#   docker compose up --build
#   docker compose exec web python manage.py seed_demo
#   docker compose exec web python manage.py createsuperuser
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rawnaq}
      POSTGRES_USER: ${POSTGRES_USER:-rawnaq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"  # optional: reach the container DB from your machine on port 5433

  web:
    build: .
    # Development only: runs as root so the bind-mounted source and media folders are writable.
    user: root
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://${POSTGRES_USER:-rawnaq}:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/${POSTGRES_DB:-rawnaq}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      SITE_URL: http://localhost:8000
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
