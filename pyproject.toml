[project]
name = "rawnaq-accessories"
version = "1.0.0"
description = "Bilingual (Arabic/English) girls' accessories store for Rawnaq Accessories."
requires-python = ">=3.13"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["core", "accounts", "catalog", "cart", "orders", "dashboard"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:axes.*",
    "ignore:No directory at:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["*/migrations/*", "staticfiles", "media", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "C4"]
ignore = [
    "S101",   # assert is fine in tests
    "DJ001",  # blank CharFields are intentional
    "S311",   # random is not used for security (order numbers use secrets)
    "DJ012",  # model member ordering is kept readable instead
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S105", "S106", "S308"]
"conftest.py" = ["S105", "S106"]
"config/settings/*" = ["F405", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "accounts", "catalog", "cart", "orders", "dashboard"]

[tool.ruff.format]
quote-style = "double"
